<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者パネル</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 pb-12">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6">
        <h1 class="text-xl font-bold mb-6 italic">🛠 Admin Panel</h1>
        
        <div class="space-y-4">
            <input type="text" id="eventName" placeholder="イベント名を入力" class="w-full border-2 p-4 rounded-xl outline-none focus:border-blue-500">
            <button onclick="createNewEvent()" id="btn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg">新規イベント作成</button>
            
            <div id="resultArea" class="hidden p-4 bg-yellow-50 rounded-xl border border-yellow-200">
                <p class="text-[10px] font-bold text-yellow-700">案内URL:</p>
                <textarea id="inviteUrl" readonly class="w-full text-[10px] p-2 border mt-1 h-16"></textarea>
                <button onclick="copyUrl()" class="w-full bg-yellow-600 text-white py-2 mt-2 rounded-lg text-sm">URLをコピー</button>
            </div>

            <a href="view.html" class="block w-full text-center py-4 bg-slate-800 text-white rounded-xl font-bold shadow-md">📊 集計・配車画面へ</a>
        </div>

        <div class="mt-10 border-t pt-6">
            <p class="text-xs font-bold text-gray-400 mb-4 uppercase">既存イベントの削除</p>
            <div id="eventList" class="space-y-2"></div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyThRaAvgBfYrvRNcbOfOTc4m5Rrgd4FoFNBY8qecgz_ubGzr3zvqUSe_4If74FWFbwEA/exec";
        const ADMIN_PASSWORD = "admin123";

        window.onload = () => {
            const pass = prompt("Password?");
            if(pass !== ADMIN_PASSWORD) location.href="index.html";
            loadEventList();
        };

        async function loadEventList() {
            const listArea = document.getElementById('eventList');
            const res = await fetch(`${GAS_URL}?action=getSheets`);
            const sheets = await res.json();
            listArea.innerHTML = sheets.map(name => `
                <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border">
                    <span class="text-xs font-bold text-gray-600">${name}</span>
                    <button onclick="deleteEvent('${name}')" class="text-[10px] bg-red-100 text-red-600 px-3 py-1 rounded-md font-bold">削除</button>
                </div>
            `).join('');
        }

        async function createNewEvent() {
            const name = document.getElementById('eventName').value.trim();
            if(!name) return;
            document.getElementById('btn').innerText = "作成中...";
            await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ type: "createEvent", eventName: name }) });
            const dir = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            document.getElementById('inviteUrl').value = `${dir}/index.html?event=${encodeURIComponent(name)}`;
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('btn').innerText = "新規イベント作成";
            loadEventList();
        }

        async function deleteEvent(name) {
            if(!confirm(`「${name}」を削除しますか？`)) return;
            await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ type: "deleteEvent", eventName: name }) });
            loadEventList();
        }

        function copyUrl() {
            const url = document.getElementById('inviteUrl');
            url.select(); document.execCommand('copy'); alert("コピーしました");
        }
    </script>
</body>
</html>
