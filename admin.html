<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント管理者パネル</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-xl font-bold text-gray-800 mb-4">🛠 イベント新規作成</h1>
        <p class="text-sm text-gray-500 mb-6">作成するとスプレッドシートに新しいシートが追加されます。</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">イベント名</label>
                <input type="text" id="eventName" placeholder="例：2026年5月 練習試合" 
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
            </div>
            <button onclick="createNewEvent()" id="btn"
                class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
                シートを作成する
            </button>
        </div>
    </div>

    <script>
        // ここをあなたの最新のURLに差し替えてください
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxAikiWUWIPGr2YrNpUa__MYISZtabOBjiCjBZ6ntIuzWqy4ePNN50680K0l0tWCe8f4g/exec";

        // 関数名を変更
        async function createNewEvent() {
            const name = document.getElementById('eventName').value;
            if(!name) return alert("イベント名を入力してください");
            
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.innerText = "作成中...";

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ type: "createEvent", eventName: name })
                });
                alert("作成リクエストを送信しました！スプレッドシートを確認してください。");
                document.getElementById('eventName').value = "";
            } catch (e) {
                alert("エラーが発生しました: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "シートを作成する";
            }
        }
    </script>
</body>
</html>
