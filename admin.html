<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント管理者パネル</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-xl font-bold text-gray-800 mb-2">🛠 イベント新規作成</h1>
        <p class="text-xs text-gray-500 mb-6 border-b pb-4">作成するとスプレッドシートに新しいシートが自動追加されます。</p>
        
        <div class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700">新しいイベント名</label>
                <input type="text" id="eventName" placeholder="例：4月20日 練習試合" 
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 border p-3">
            </div>
            
            <button onclick="createNewEvent()" id="btn"
                class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition shadow-md">
                シートを作成してURLを発行
            </button>

            <div id="resultArea" class="hidden mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                <p class="text-xs font-bold text-yellow-800 mb-2">案内用URL：</p>
                <textarea id="inviteUrl" readonly class="w-full text-xs p-2 border border-yellow-300 bg-white rounded mb-2 h-16"></textarea>
                <button onclick="copyUrl()" class="w-full bg-yellow-600 text-white py-2 rounded text-sm hover:bg-yellow-700 transition">URLをコピー</button>
            </div>
        </div>
        
        <div class="mt-10 text-center">
            <a href="index.html" class="text-blue-500 text-sm hover:underline">← フォーム画面へ戻る</a>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxAikiWUWIPGr2YrNpUa__MYISZtabOBjiCjBZ6ntIuzWqy4ePNN50680K0l0tWCe8f4g/exec"; 

        async function createNewEvent() {
            const nameInput = document.getElementById('eventName');
            const name = nameInput.value.trim();
            if(!name) return alert("名前を入力してください");
            
            const btn = document.getElementById('btn');
            const resultArea = document.getElementById('resultArea');
            const inviteUrlInput = document.getElementById('inviteUrl');

            btn.disabled = true;
            btn.innerText = "作成中...";
            resultArea.classList.add('hidden');

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ type: "createEvent", eventName: name })
                });

                // URL生成ロジック
                let currentUrl = window.location.href;
                let baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1);
                const finalUrl = `${baseUrl}index.html?event=${encodeURIComponent(name)}`;
                
                inviteUrlInput.value = finalUrl;
                resultArea.classList.remove('hidden');
                
                alert("スプレッドシートにシートを作成しました！");
            } catch (e) {
                alert("エラーが発生しました");
            } finally {
                btn.disabled = false;
                btn.innerText = "シートを作成してURLを発行";
            }
        }

        function copyUrl() {
            const urlText = document.getElementById('inviteUrl');
            urlText.select();
            document.execCommand('copy');
            alert("コピーしました！LINEなどで送ってください。");
        }
    </script>
</body>
</html>
