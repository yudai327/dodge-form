<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント管理者パネル</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 pb-12">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-6 md:p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">🛠 イベント新規作成</h1>
        <p class="text-xs text-gray-500 mb-6 border-b pb-4">新しいイベント名を入力して「作成」を押すと、スプレッドシートに専用シートが追加されます。</p>
        
        <div class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">イベント名</label>
                <input type="text" id="eventName" placeholder="例：2026年5月 練習試合" 
                    class="mt-1 block w-full rounded-xl border-2 border-gray-200 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-4 text-lg outline-none transition-all">
            </div>
            
            <button onclick="createNewEvent()" id="btn"
                class="w-full bg-blue-600 text-white font-extrabold py-4 px-4 rounded-xl hover:bg-blue-700 transition-all shadow-lg active:scale-95 text-lg">
                シートを作成してURL発行
            </button>

            <div id="resultArea" class="hidden mt-8 p-5 bg-yellow-50 border-2 border-yellow-200 rounded-2xl shadow-inner">
                <p class="text-sm font-bold text-yellow-800 mb-2 flex items-center">
                    <span class="mr-1">🔗</span> 案内用URLが作成されました：
                </p>
                <textarea id="inviteUrl" readonly class="w-full text-xs p-3 border border-yellow-300 bg-white rounded-lg mb-3 h-24 shadow-sm text-gray-600 focus:outline-none"></textarea>
                <button onclick="copyUrl()" class="w-full bg-yellow-600 text-white py-3 rounded-xl font-bold hover:bg-yellow-700 transition shadow active:scale-95">
                    URLをコピーする
                </button>
                <p class="text-[10px] text-yellow-700 mt-2 text-center">※このURLをLINEやメールで配布してください</p>
            </div>

            <div class="mt-10 pt-8 border-t border-gray-100 space-y-3">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Management</p>
                <a href="view.html" class="flex items-center justify-between w-full p-4 bg-gray-800 text-white rounded-xl font-bold hover:bg-black transition shadow-md">
                    <span>📊 回答の集計・配車編集</span>
                    <span class="text-xl">→</span>
                </a>
                <a href="index.html" class="flex items-center justify-center w-full p-2 text-blue-500 text-sm hover:underline">
                    ← 回答用フォームを表示
                </a>
            </div>
        </div>
    </div>

    <script>
        // ★重要：あなたの最新のGAS URLに書き換えてください
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxc7i-jap8kSe2_0uY-dTuvPco5yuYHxtBiPBzL47sbXGfqrACWDnY-uvBui4SAQwRRQw/exec";
        const ADMIN_PASSWORD = "123"; // 必要に応じて変更

        // ページ読み込み時にパスワード確認
        window.onload = () => {
            const inputPass = prompt("管理者パスワードを入力してください");
            if (inputPass !== ADMIN_PASSWORD) {
                alert("パスワードが違います");
                location.href = "index.html"; // フォームへ強制移動
            }
        };

        async function createNewEvent() {
            const nameInput = document.getElementById('eventName');
            const name = nameInput.value.trim();
            if(!name) return alert("イベント名を入力してください");
            
            const btn = document.getElementById('btn');
            const resultArea = document.getElementById('resultArea');
            const inviteUrlInput = document.getElementById('inviteUrl');

            btn.disabled = true;
            btn.innerText = "作成中...";
            resultArea.classList.add('hidden');

            try {
                // GASへ新規シート作成リクエストを送信
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ type: "createEvent", eventName: name })
                });

                // URL生成ロジック：404エラーを防ぐためディレクトリパスを正確に取得
                const currentHref = window.location.href;
                // ファイル名（admin.html）を除いたパスを取得
                const directoryPath = currentHref.substring(0, currentHref.lastIndexOf('/'));
                
                // 正しいURLを組み立て
                const finalUrl = `${directoryPath}/index.html?event=${encodeURIComponent(name)}`;
                
                inviteUrlInput.value = finalUrl;
                resultArea.classList.remove('hidden');
                
                alert("スプレッドシートに「" + name + "」のシートを作成しました。");

            } catch (e) {
                console.error(e);
                alert("エラーが発生しました。インターネット接続やGASの設定を確認してください。");
            } finally {
                btn.disabled = false;
                btn.innerText = "シートを作成してURL発行";
            }
        }

        // クリップボードへコピー
        function copyUrl() {
            const urlText = document.getElementById('inviteUrl');
            urlText.select();
            urlText.setSelectionRange(0, 99999); // iOS/Android対応
            
            try {
                document.execCommand('copy');
                alert("URLをコピーしました！LINEなどで送信してください。");
            } catch (err) {
                alert("コピーに失敗しました。枠内のURLを手動で選択してコピーしてください。");
            }
        }
    </script>
</body>
</html>
