<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配車管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 pb-32">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">📊 配車管理（学年別）</h1>
            <div class="flex gap-2">
                <select id="sheetSelect" class="border-2 border-blue-200 p-2 rounded-lg bg-white"></select>
                <button onclick="loadData()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">読込</button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl overflow-x-auto border">
            <table class="w-full text-left border-collapse min-w-[1000px]">
                <thead>
                    <tr class="bg-slate-800 text-white text-[10px]">
                        <th class="p-4 border-r border-slate-700 w-16">学年</th>
                        <th class="p-4 border-r border-slate-700">名前</th>
                        <th class="p-4 border-r border-slate-700 text-center w-20">参加</th>
                        <th class="p-4 border-r border-slate-700 bg-blue-900 w-44">自車(空き) / 確定</th>
                        <th class="p-4 border-r border-slate-700 bg-orange-900 w-56">他車(希望) / 配車メモ</th>
                        <th class="p-4">備考 (上書き・編集用)</th>
                    </tr>
                </thead>
                <tbody id="dataTable" class="text-xs"></tbody>
            </table>
        </div>

        <button onclick="saveChanges()" id="saveBtn" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-600 text-white px-12 py-5 rounded-full font-black shadow-2xl active:scale-95 text-lg">【結果】を作成・保存</button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwUiiynEDBvBNe5o7PrhMcCwFypBvrRosmuLaC3vJPM2KCpX6ZLMupBJwlH-SZIj8VO_w/exec";
        const ADMIN_PASSWORD = "admin123";
        let currentRows = [];

        window.onload = async () => {
            const pass = prompt("Password?");
            if(pass !== ADMIN_PASSWORD) location.href="index.html";
            const res = await fetch(`${GAS_URL}?action=getSheets`);
            const sheets = await res.json();
            const select = document.getElementById('sheetSelect');
            sheets.forEach(s => select.innerHTML += `<option value="${s}">${s}</option>`);
        };

        async function loadData() {
            const name = document.getElementById('sheetSelect').value;
            const res = await fetch(`${GAS_URL}?action=getData&sheetName=${encodeURIComponent(name)}`);
            const data = await res.json();
            currentRows = data.rows;
            renderTable(data.rows);
        }

        function renderTable(rows) {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = rows.map((row, i) => {
                const isAttending = row[2] === '参加';
                let memo = (row[7] || "").toString();
                let note = (row[8] || "").toString();
                if(memo.includes('T') && memo.includes('Z')) memo = ""; // 日付誤入ガード
                if(note.includes('T') && note.includes('Z')) note = "";

                return `
                <tr class="${isAttending ? '' : 'bg-red-50 opacity-50'} border-b">
                    <td class="p-4 border-r">${row[0]}</td>
                    <td class="p-4 font-bold border-r">${row[1]}</td>
                    <td class="p-4 text-center border-r font-bold">${row[2]}</td>
                    <td class="p-4 bg-blue-50/50 border-r">
                        <div class="flex items-center justify-between">
                            <span>${row[3]==='可' ? `空き:${row[4]}` : '-'}</span>
                            <input type="checkbox" ${row[3]==='可' ? 'checked' : ''} onchange="currentRows[${i}][3]=this.checked?'可':'不可'" class="w-5 h-5">
                        </div>
                    </td>
                    <td class="p-4 bg-orange-50/50 border-r">
                        <div class="flex flex-col gap-1">
                            <span class="text-[10px] font-bold text-orange-700">${row[5]==='可' ? `希望:${row[6]}名` : ''}</span>
                            <input type="text" value="${memo}" oninput="currentRows[${i}][7]=this.value" class="w-full p-2 border rounded shadow-sm" placeholder="配車先を入力">
                        </div>
                    </td>
                    <td class="p-2"><textarea oninput="currentRows[${i}][8]=this.value" class="w-full p-2 border rounded h-12 shadow-sm">${note}</textarea></td>
                </tr>
            `}).join('');
        }

        async function saveChanges() {
            const name = document.getElementById('sheetSelect').value;
            const btn = document.getElementById('saveBtn');
            btn.innerText = "保存中...";
            await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ type: "updateData", eventName: name, rows: currentRows }) });
            alert(`「【結果】${name}」を6項目に絞って保存しました！`);
            btn.innerText = "【結果】を作成・保存";
        }
    </script>
</body>
</html>
