<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集計・配車</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4 pb-32">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">📊 配車管理</h1>
            <div class="flex gap-2">
                <select id="sheetSelect" class="border p-2 rounded-lg bg-white"></select>
                <button onclick="loadData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">読込</button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[1000px]">
                <thead>
                    <tr class="bg-slate-800 text-white text-[10px]">
                        <th class="p-3 border-r border-slate-700">名前</th>
                        <th class="p-3 border-r border-slate-700 text-center">参加</th>
                        <th class="p-3 border-r border-slate-700 bg-blue-900">自車(空き) / 確定</th>
                        <th class="p-3 border-r border-slate-700 bg-orange-900">他車(希望) / 配車メモ</th>
                        <th class="p-3">備考 (自由編集)</th>
                    </tr>
                </thead>
                <tbody id="dataTable" class="text-xs"></tbody>
            </table>
        </div>

        <button onclick="saveChanges()" id="saveBtn" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-600 text-white px-12 py-4 rounded-full font-bold shadow-2xl active:scale-95 text-lg">【結果】として保存</button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyI-wxjhiMhzOWtwVNYXtu9an6vQN5N-X0vGGoGlpy-h7_KTd2kJ6xN3G603PkHMFhKhg/exec";
        const ADMIN_PASSWORD = "admin123";
        let currentRows = [];

        window.onload = async () => {
            const pass = prompt("Password?");
            if(pass !== ADMIN_PASSWORD) location.href="index.html";
            const res = await fetch(`${GAS_URL}?action=getSheets`);
            const sheets = await res.json();
            const select = document.getElementById('sheetSelect');
            sheets.forEach(s => select.innerHTML += `<option value="${s}">${s}</option>`);
        };

        async function loadData() {
            const name = document.getElementById('sheetSelect').value;
            const res = await fetch(`${GAS_URL}?action=getData&sheetName=${encodeURIComponent(name)}`);
            const data = await res.json();
            currentRows = data.rows;
            renderTable(data.rows);
        }

        function renderTable(rows) {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = rows.map((row, i) => `
                <tr class="${row[2]==='参加' ? '' : 'bg-red-50 opacity-50'} border-b">
                    <td class="p-3 font-bold">${row[1]}</td>
                    <td class="p-3 text-center">${row[2]}</td>
                    <td class="p-3 bg-blue-50 flex items-center justify-between">
                        <span>${row[3]==='可' ? `空き:${row[4]}` : '-'}</span>
                        <input type="checkbox" ${row[3]==='可' ? 'checked' : ''} onchange="currentRows[${i}][3]=this.checked?'可':'不可'" class="w-4 h-4">
                    </td>
                    <td class="p-3 bg-orange-50">
                        <div class="flex flex-col gap-1">
                            <span class="text-[10px] font-bold text-orange-700">${row[5]==='可' ? `希望:${row[6]}名` : ''}</span>
                            <input type="text" value="${row[7]||''}" oninput="currentRows[${i}][7]=this.value" class="w-full p-1 border rounded" placeholder="配車先...">
                        </div>
                    </td>
                    <td class="p-1"><textarea oninput="currentRows[${i}][8]=this.value" class="w-full p-2 border rounded h-10">${row[8]||''}</textarea></td>
                </tr>
            `).join('');
        }

        async function saveChanges() {
            const name = document.getElementById('sheetSelect').value;
            const btn = document.getElementById('saveBtn');
            btn.innerText = "保存中...";
            await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ type: "updateData", eventName: name, rows: currentRows }) });
            alert(`「【結果】${name}」として保存しました！`);
            btn.innerText = "【結果】として保存";
        }
    </script>
</body>
</html>
