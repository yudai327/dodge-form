<form id="myForm">
  <input type="text" id="name" placeholder="お名前" required>
  <input type="email" id="email" placeholder="メールアドレス" required>
  <textarea id="message" placeholder="メッセージ"></textarea>
  <button type="submit">送信</button>
</form>

<script>
  const url = "https://script.google.com/macros/s/AKfycbzdDupMqLGAhOvC3olN4BmdzydaTmvwvGG9cp5i4NZc/dev";

  document.getElementById('myForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const data = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      message: document.getElementById('message').value
    };

    // fetchのオプションを変更
    fetch(url, {
      method: 'POST',
      mode: 'no-cors', // CORSエラーを強制的に無視するモード
      headers: {
        'Content-Type': 'text/plain', // あえてJSONではなくテキストとして送る（GASの制限回避）
      },
      body: JSON.stringify(data)
    })
    .then(() => {
      // no-corsモードではレスポンスが取れないため、成否に関わらずここに来る
      alert('送信処理を実行しました。スプレッドシートを確認してください！');
      document.getElementById('myForm').reset();
    })
    .catch(error => {
      alert('通信エラーが発生しました: ' + error.message);
    });
  });
</script>
