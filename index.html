<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参加回答フォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 pb-24">
    <div class="max-w-lg mx-auto bg-white rounded-3xl shadow-xl p-6">
        <h1 class="text-2xl font-extrabold text-blue-700 mb-6 border-b pb-4">参加確認アンケート</h1>
        <form id="ansForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">対象イベント</label>
                <select id="eventName" required class="w-full border-2 border-blue-100 rounded-xl p-4 bg-blue-50 font-bold outline-none focus:border-blue-500"></select>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="name" required placeholder="名前" class="border p-4 rounded-xl text-lg">
                <select id="grade" class="border p-4 rounded-xl text-lg bg-white">
                    <option>1年</option><option>2年</option><option>3年</option><option>4年</option><option>5年</option><option>6年</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">参加の可否</label>
                <div class="flex gap-4">
                    <label class="flex-1 border-2 p-4 rounded-2xl text-center has-[:checked]:bg-blue-100 has-[:checked]:border-blue-500"><input type="radio" name="attendance" value="参加" checked class="hidden"> 参加</label>
                    <label class="flex-1 border-2 p-4 rounded-2xl text-center has-[:checked]:bg-red-100 has-[:checked]:border-red-500"><input type="radio" name="attendance" value="不参加" class="hidden"> 欠席</label>
                </div>
            </div>
            <div class="bg-blue-50 p-4 rounded-2xl">
                <label class="block text-xs font-bold text-blue-800 mb-2">送迎（自車）の空き数</label>
                <div class="flex gap-2 items-center">
                    <select id="pickup" class="p-2 rounded-lg border flex-1"><option value="不可">不可</option><option value="可">可</option></select>
                    <input type="number" id="pickupCount" value="0" class="w-20 p-2 rounded-lg border text-center" placeholder="人数">
                </div>
            </div>
            <div class="bg-orange-50 p-4 rounded-2xl">
                <label class="block text-xs font-bold text-orange-800 mb-2">乗合（他車）への希望人数</label>
                <div class="flex gap-2 items-center">
                    <select id="carpool" class="p-2 rounded-lg border flex-1"><option value="不可">不要</option><option value="可">希望</option></select>
                    <input type="number" id="carpoolCount" value="0" class="w-20 p-2 rounded-lg border text-center" placeholder="人数">
                </div>
            </div>
            <textarea id="note" placeholder="備考" class="w-full border p-4 rounded-xl" rows="2"></textarea>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95">回答を送信する</button>
        </form>
    </div>
    <a href="admin.html" class="fixed bottom-6 right-6 bg-gray-800/40 text-white p-3 rounded-full text-xs backdrop-blur">⚙️ 管理</a>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyThRaAvgBfYrvRNcbOfOTc4m5Rrgd4FoFNBY8qecgz_ubGzr3zvqUSe_4If74FWFbwEA/exec";
        window.onload = async () => {
            const select = document.getElementById('eventName');
            const eventParam = new URLSearchParams(window.location.search).get('event');
            const res = await fetch(`${GAS_URL}?action=getSheets`);
            const sheets = await res.json();
            sheets.forEach(s => {
                const opt = new Option(s, s);
                if(s === eventParam) opt.selected = true;
                select.add(opt);
            });
        };
        document.getElementById('ansForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "送信中...";
            const data = {
                eventName: document.getElementById('eventName').value,
                grade: document.getElementById('grade').value,
                name: document.getElementById('name').value,
                attendance: document.querySelector('input[name="attendance"]:checked').value,
                pickup: document.getElementById('pickup').value,
                pickupCount: document.getElementById('pickupCount').value,
                carpool: document.getElementById('carpool').value,
                carpoolCount: document.getElementById('carpoolCount').value,
                note: document.getElementById('note').value
            };
            await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            alert("送信完了！"); location.reload();
        });
    </script>
</body>
</html>
